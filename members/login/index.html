<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>CULytics Member Login</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:500px;
    margin:50px auto;
    padding:20px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    box-sizing:border-box;
}

button{
    padding:12px 20px;
    cursor:pointer;
}

.hidden{
    display:none;
}

#message{
    margin-top:15px;
}
</style>

</head>

<body>

<h2>Member Login</h2>

<input
type="email"
id="email"
placeholder="Email Address"

>

<button id="continueBtn">
    Continue
</button>

<div id="newUserFields" class="hidden">

<h3>Tell us about yourself</h3>

<input
    type="text"
    id="name"
    placeholder="Full Name"
>

<input
    type="text"
    id="title"
    placeholder="Title"
>

<input
    type="text"
    id="organization"
    placeholder="Organization Name"
>

</div>

<div id="otpSection" class="hidden">

<input
    type="text"
    id="otp"
    placeholder="Enter 6-digit OTP"
>

<button id="verifyBtn">
    Verify OTP
</button>

</div>

<p id="message"></p>

<script type="module">

import { createClient }
from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
    'https://tkwpqjekdwwacqxwmmri.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrd3BxamVrZHd3YWNxeHdtbXJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTg1MDIsImV4cCI6MjA5NTczNDUwMn0.ppYBTNyhopXJJ7ASE9Y3oPXeuXhX3nlXiYTEObD2mD4'
);

let userType = null;

const emailInput =
document.getElementById('email');

const message =
document.getElementById('message');

const otpSection =
document.getElementById('otpSection');

const newUserFields =
document.getElementById('newUserFields');

document
.getElementById('continueBtn')
.addEventListener('click', async () => {

    const email =
    emailInput.value.trim().toLowerCase();

    const { data: member, error } =
    await supabase
        .from('members')
        .select('status')
        .eq('email', email)
        .single();

    console.log("Email entered:", email);
    console.log("Member result:", member);
    console.log("Error:", error);

    alert(JSON.stringify(member));

    if(member){

        userType = member.status;

    } else {

        userType = 'new';

        newUserFields
        .classList
        .remove('hidden');
    }

    const { error } =
    await supabase.auth.signInWithOtp({
        email
    });

    if(error){

        message.innerText =
        error.message;

        return;
    }

    otpSection
    .classList
    .remove('hidden');

    message.innerText =
    'OTP sent to your email.';
});

document
.getElementById('verifyBtn')
.addEventListener('click', async () => {

    const email =
    emailInput.value.trim().toLowerCase();

    const token =
    document.getElementById('otp')
    .value.trim();

    const { error } =
    await supabase.auth.verifyOtp({
        email,
        token,
        type:'email'
    });

    if(error){

        message.innerText =
        error.message;

        return;
    }

    if(userType === 'approved'){

        window.location.href =
               '/events/';

        return;
    }

    if(userType === 'imported'){

        window.location.href =
        '/members/access-pending/';

        return;
    }

    if(userType === 'new'){

        const name =
        document.getElementById('name')
        .value.trim();

        const title =
        document.getElementById('title')
        .value.trim();

        const organization =
        document.getElementById('organization')
        .value.trim();

        if(!name || !title || !organization){

            message.innerText =
            'Please complete all fields.';

            return;
        }

        await supabase
            .from('pending_members')
            .upsert({
                email,
                name,
                title,
                organization
            });

        window.location.href =
        '/members/access-pending/';
    }

});

</script>

</body>
</html>
